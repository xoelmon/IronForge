name: Compilar IronForge (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que se han subido todos los archivos
        shell: pwsh
        run: |
          $needed = "CMakeLists.txt","Source/PluginProcessor.cpp","Source/PluginProcessor.h","Source/PluginEditor.cpp","Source/PluginEditor.h","Source/DSP.h","Source/UI.h","Source/Params.h"
          $missing = $needed | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "FALTAN ARCHIVOS EN EL REPOSITORIO: $($missing -join ', ')"
            Write-Host "Esto es lo que si hay:"
            Get-ChildItem -Recurse -Name | Select-Object -First 80
            exit 1
          }

      - name: Configurar
        run: cmake -S . -B build -A x64

      - name: Compilar
        run: cmake --build build --config Release --target IronForge_VST3 IronForge_Standalone --parallel

      - name: Preparar carpeta de salida
        shell: pwsh
        run: |
          Write-Host "Archivos generados:"
          Get-ChildItem -Recurse build/IronForge_artefacts | Where-Object { $_.Name -like "IronForge*" } | ForEach-Object { $_.FullName }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item -Recurse "build/IronForge_artefacts/Release/VST3/IronForge.vst3" "dist/IronForge.vst3"
          Copy-Item "build/IronForge_artefacts/Release/Standalone/IronForge.exe" "dist/IronForge.exe"

      - name: Subir resultado
        uses: actions/upload-artifact@v4
        with:
          name: IronForge-Windows
          path: dist
